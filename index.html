<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap — Student Skill Exchange</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b1329; color: #f4f5f6; padding: 40px 20px; }
        
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.5rem; color: #ffffff; margin-bottom: 8px; }
        header h1 span { color: #6366f1; }
        header p { color: #94a3b8; }

        /* Main Grid Split */
        .main-content { display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media (min-width: 768px) { .main-content { grid-template-columns: 350px 1fr; } }

        /* Form Card */
        .form-card { background: #1e293b; padding: 24px; border-radius: 12px; height: fit-content; border: 1px solid #334155; }
        .form-card h2 { font-size: 1.25rem; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        .form-group input, .form-group textarea { z-index: 10; width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 0.9rem; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #6366f1; }
        .btn { display: inline-block; width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #4f46e5; }

        /* Directory Cards Feed */
        .feed-section h2 { font-size: 1.5rem; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;}
        .feed-section h2 span { font-size: 0.9rem; color: #94a3b8; font-weight: normal; }
        .grid-feed { display: grid; grid-template-columns: 1fr; gap: 20px; }
        
        .swap-card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .card-name { font-weight: bold; color: #ffffff; }
        
        .badge-box { display: flex; gap: 10px; margin-bottom: 12px; font-size: 0.85rem; font-family: monospace; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-teaches { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .badge-wants { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        
        .card-desc { font-size: 0.9rem; color: #cbd5e1; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><span>Skill</span>Swap</h1>
        <p>No money required. Trade campus knowledge directly with peers.</p>
    </header>

    <div class="main-content">
        <!-- Input Form Section -->
        <section class="form-card">
            <h2>Post Your Skills</h2>
            <form id="swapForm">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="userName" placeholder="e.g., Jane Ally" required>
                </div>
                <div class="form-group">
                    <label>Skill You Can Teach</label>
                    <input type="text" id="userOffers" placeholder="e.g., C++ Vectors" required>
                </div>
                <div class="form-group">
                    <label>Skill You Want to Learn</label>
                    <input type="text" id="userWants" placeholder="e.g., UI Styling" required>
                </div>
                <div class="form-group">
                    <label>Short Description</label>
                    <textarea id="userDesc" rows="4" placeholder="Mention your availability or current classes..." required></textarea>
                </div>
                <button type="submit" class="btn">Publish Offer</button>
            </form>
        </section>

        <!-- Dynamic Feed Directory Section -->
        <section class="feed-section">
            <h2>Active Listings <span id="cardCount">Loading...</span></h2>
            <div class="grid-feed" id="feedContainer">
                <!-- Cards inject here dynamically -->
            </div>
        </section>
    </div>
</div>

<script>
    const feedContainer = document.getElementById('feedContainer');
    const swapForm = document.getElementById('swapForm');
    const cardCount = document.getElementById('cardCount');

    // 1. Fetch skills from the Express Node backend
    async function loadFeed() {
        try {
            const response = await fetch('/api/swaps');
            const listings = await response.json();
            
            cardCount.innerText = `(${listings.length})`;
            feedContainer.innerHTML = ''; // Clear container placeholder

            listings.forEach(item => {
                const card = document.createElement('div');
                card.className = 'swap-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-name">👤 ${item.name}</span>
                    </div>
                    <div class="badge-box">
                        <span class="badge badge-teaches">TEACHES: ${item.offers}</span>
                        <span class="badge badge-wants">WANTS: ${item.wants}</span>
                    </div>
                    <p class="card-desc">${item.description}</p>
                `;
                feedContainer.appendChild(card);
            });
        } catch (error) {
            feedContainer.innerHTML = `<p style="color: #ef4444;">Could not load feed updates.</p>`;
        }
    }

    // 2. Submit new listing to Backend
    swapForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            name: document.getElementById('userName').value,
            offers: document.getElementById('userOffers').value,
            wants: document.getElementById('userWants').value,
            description: document.getElementById('userDesc').value
        };

        try {
            const response = await fetch('/api/swaps', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                swapForm.reset(); // Reset fields
                loadFeed(); // Reload updated feed instantly
            }
        } catch (error) {
            alert("Error sending trade data.");
        }
    });

    // Run initial feed pull on screen start
    loadFeed();
</script>
</body>
</html>
